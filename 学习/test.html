<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        .board {
            width: 420px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 16px;
            font-size: 24px;
        }

        .editor {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        #messageInput {
            flex: 1;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        #publishBtn {
            width: 80px;
            border: none;
            border-radius: 8px;
            background-color: #ff6b81;
            color: #fff;
            cursor: pointer;
        }

        #publishBtn:hover {
            background-color: #ff4f6a;
        }

        #messageList {
            list-style: none;
        }

        #messageList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #ffe4ea;
            border-radius: 8px;
            color: #333;
            word-break: break-all;
        }

        .message-text {
            flex: 1;
        }

        .delete-btn {
            border: none;
            background-color: #ff6b81;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background-color: #ff4f6a;
        }

        .empty {
            display: block;
            color: #999;
            text-align: center;
            padding: 12px 0;
        }
    </style>
</head>
<body>
    <script src="jQuery.min.js"></script>
    <div class="board">
        <h2>留言板</h2>
        <div class="editor">
            <input id="messageInput" type="text" placeholder="请输入留言内容">
            <button id="publishBtn">发布</button>
        </div>
        <ul id="messageList">
            <li class="empty">还没有留言，快来发布第一条吧</li>
        </ul>
    </div>
    <script>
        $(function () {
            $('#publishBtn').click(function () {
                var content = $('#messageInput').val().trim();

                if (!content) {
                    alert('请输入留言内容');
                    return;
                }

                $('#messageList .empty').remove();
                $('#messageList').prepend(
                    '<li><span class="message-text">' + content + '</span><button class="delete-btn">删除</button></li>'
                );
                $('#messageInput').val('').focus();
            });

            $('#messageInput').keydown(function (e) {
                if (e.key === 'Enter') {
                    $('#publishBtn').click();
                }
            });

            $('#messageList').on('click', '.delete-btn', function () {
                $(this).parent('li').remove();

                if ($('#messageList li').length === 0) {
                    $('#messageList').html('<li class="empty">还没有留言，快来发布第一条吧</li>');
                }
            });
        });
    </script>
</body>
</html>
