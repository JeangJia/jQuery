<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件冒泡演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            padding: 30px 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        h2 { color: #333; margin-bottom: 6px; }
        .sub { color: #888; font-size: 13px; margin-bottom: 20px; }

        .layout { display: flex; gap: 20px; align-items: flex-start; }

        /* ---------- 左侧：三层嵌套盒子 ---------- */
        .demo-area {
            flex: 1;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }

        .box {
            border-radius: 10px;
            padding: 28px 20px 20px;
            position: relative;
            transition: all .25s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .box .tag {
            position: absolute; top: 6px; left: 14px;
            font-size: 12px; font-weight: bold;
        }

        /* 层级颜色由外到内 */
        #grandpa { background: #eaf4ff; }
        #grandpa .tag { color: #1d6fea; }
        #father { background: #d6e8ff; margin: 8px 12px; }
        #father .tag { color: #0d5ed8; }
        #son { background: #ffe9c7; margin: 8px 12px; padding: 20px; }
        #son .tag { color: #c07a00; text-align: center; display: block; position: static; margin-bottom: 4px;}

        /* 冒泡经过时的高亮 */
        .box.bubbling {
            border-color: #e74c3c;
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(231, 76, 60, .3);
        }

        /* ---------- 开关 ---------- */
        .controls {
            margin-top: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #555;
        }
        .controls input { transform: scale(1.3); cursor: pointer; }

        /* ---------- 右侧：日志 ---------- */
        .log-area {
            width: 320px;
            background: #1e1e1e;
            border-radius: 10px;
            padding: 16px;
            color: #b5e853;
            font-family: Consolas, monospace;
            font-size: 13px;
            min-height: 300px;
        }
        .log-area h4 {
            color: #fff; margin-bottom: 10px;
            padding-bottom: 8px; border-bottom: 1px solid #444;
        }
        .log-line { padding: 4px 0; animation: slideIn .2s; }
        .log-line.self { color: #f7c843; }
        .log-line.pass { color: #b5e853; }
        .log-line.stop { color: #f48771; }
        .log-line.dim  { color: #666; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .clear-btn {
            margin-top: 10px; padding: 4px 12px;
            background: #333; color: #ccc;
            border: 1px solid #555; border-radius: 4px;
            cursor: pointer; font-size: 12px;
        }
        .clear-btn:hover { background: #444; }

        /* ---------- 下方：真实场景演示 ---------- */
        .real-world {
            margin-top: 24px;
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.05);
        }
        .real-world h3 { color: #333; font-size: 15px; margin-bottom: 8px; }
        .real-world p  { color: #888; font-size: 13px; margin-bottom: 14px; line-height: 1.7; }
        .real-world p b { color: #e74c3c; }

        .popup-demo { text-align: center; padding: 10px 0; }

        /* 弹窗 */
        .popup {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 10;
            justify-content: center; align-items: center;
        }
        .popup-box {
            width: 300px; background: #fff; border-radius: 10px;
            padding: 24px; text-align: center;
            animation: zoom .2s;
        }
        @keyframes zoom {
            from { transform: scale(.85); opacity: 0; }
            to   { transform: scale(1);  opacity: 1; }
        }
        .popup-box h4 { margin-bottom: 16px; color: #333; }
        .popup-box button {
            padding: 8px 20px; margin: 0 4px;
            border: none; border-radius: 5px; cursor: pointer;
            font-size: 13px;
        }
        #pCancel { background: #f0f0f0; color: #666; }
        #pOk     { background: #e74c3c; color: #fff; }

        .open-btn {
            padding: 8px 20px; background: #1d6fea; color: #fff;
            border: none; border-radius: 5px; cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<script src="jQuery.min.js"></script>

<body>
    <div class="container">
        <h2>🫧 事件冒泡演示</h2>
        <p class="sub">点击任意一层盒子，观察事件如何从被点击的元素一路"冒"到最外层</p>

        <div class="layout">
            <!-- 左：嵌套盒子 -->
            <div class="demo-area">
                <div class="box" id="grandpa">
                    <span class="tag">grandpa</span>
                    <div class="box" id="father">
                        <span class="tag">father</span>
                        <div class="box" id="son">
                            <span class="tag">son← 点这里试试</span>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <label>
                        <input type="checkbox" id="stopSwitch">
                        在 son 上阻止冒泡（e.stopPropagation）
                    </label>
                </div>
            </div>

            <!-- 右：日志 -->
            <div class="log-area">
                <h4>📋 事件传播日志</h4>
                <div id="log"></div>
                <button class="clear-btn" id="clearLog">清空日志</button>
            </div>
        </div>

        <!-- 真实场景 -->
        <div class="real-world">
            <h3>🎯 真实场景：点弹窗外关闭，点按钮不关闭</h3>
            <p>
                常见需求：点击<b>遮罩层空白处</b>关闭弹窗，但点击<b>弹窗内部按钮</b>时不能误关。
                因为按钮的 click 会冒泡到遮罩层，所以必须在弹窗盒子（或按钮）上调用
                <b>stopPropagation()</b> 拦截。
            </p>
            <div class="popup-demo">
                <button class="open-btn" id="openPopup">打开弹窗</button>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="popup" id="popup">
        <div class="popup-box" id="popupBox">
            <h4>确定要删除吗？</h4>
            <button id="pCancel">取消</button>
            <button id="pOk">确定</button>
        </div>
    </div>

    <script>
        // ================= 左侧：冒泡演示 =================
        var $log = $('#log');

        function log(text, cls) {
            var time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            var $line = $('<div class="log-line ' + (cls || '') + '"></div>')
                .text('[' + time + '] ' + text);
            $log.prepend($line);
        }

        // 三层都监听 click
        $('#grandpa').on('click', function () {
            $(this).addClass('bubbling');
            log('👉 grandpa 的 click 处理函数执行了', 'pass');
            var $g = $(this);
            setTimeout(function () { $g.removeClass('bubbling'); }, 600);
        });

        $('#father').on('click', function (e) {
            $(this).addClass('bubbling');
            // e.currentTarget 是"事件绑在谁身上"，e.target 是"真正被点的是谁"
            log('👉 father 的 click 处理函数执行了（真正被点的是：' + $(e.target).attr('id') + '）', 'pass');
            var $f = $(this);
            setTimeout(function () { $f.removeClass('bubbling'); }, 600);
        });

        $('#son').on('click', function (e) {
            $(this).addClass('bubbling');
            log('💥 son 的 click 处理函数执行了（事件发生地）', 'self');

            // 是否阻止冒泡由开关决定
            if ($('#stopSwitch').prop('checked')) {
                e.stopPropagation();
                log('🛑 son 调用了 stopPropagation()，冒泡到此为止！', 'stop');
            } else {
                log('⬆️ 事件继续向上冒泡...', 'dim');
            }

            var $s = $(this);
            setTimeout(function () { $s.removeClass('bubbling'); }, 600);
        });

        $('#clearLog').on('click', function () { $log.empty(); });

        // ================= 右侧：真实场景（弹窗） =================

        // 打开弹窗
        $('#openPopup').on('click', function (e) {
            e.stopPropagation();                    // 防止打开按钮的 click 冒泡干扰
            $('#popup').css('display', 'flex');
        });

        // 需求①：点击遮罩层（弹窗外部）关闭
        $('#popup').on('click', function () {
            $(this).hide();
        });

        // 需求②：点击弹窗盒子内部，不能关闭
        // —— 因为 click 会从按钮冒泡到 #popup，所以必须拦截
        $('#popupBox').on('click', function (e) {
            e.stopPropagation();                    // 关键：把冒泡拦在弹窗盒子这一层
        });

        // 按钮自己的逻辑
        $('#pOk').on('click', function () {
            alert('删除成功！');
            $('#popup').hide();
        });
        $('#pCancel').on('click', function () {
            $('#popup').hide();
        });
    </script>
</body>

</html>
